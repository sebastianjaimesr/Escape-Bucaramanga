<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="theme-color" content="#0f0a1f">
	<meta name="description" content="Escape de Bucaramanga: plataformas 2D nocturno por el Centro, Cabecera, San Pío, García Rovira, el Viaducto de la Novena y el Cerro del Santísimo. Hecho en Godot 4.">
	<meta property="og:title" content="Escape de Bucaramanga">
	<meta property="og:description" content="Una noche, una confusión y toda la ciudad por delante. Juego de plataformas 2D hecho en Godot 4.">
	<meta property="og:type" content="website">
	<meta property="og:image" content="preview.png">
	<meta name="twitter:card" content="summary_large_image">
	<title>$GODOT_PROJECT_NAME</title>
	<style>
:root { --neon: #ff4d74; --blue: #5aa0ff; --gold: #ffd27a; --bg: #0f0a1f; }
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body {
	color: #f4ecff; background: var(--bg); overflow: hidden; touch-action: none;
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
}
#canvas { display: block; }
#canvas:focus { outline: none; }

#status {
	position: absolute; inset: 0; z-index: 2;
	display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 1.1rem;
	background:
		radial-gradient(ellipse at 50% 120%, rgba(160, 60, 130, .55), transparent 60%),
		linear-gradient(#0a0820, #241646 70%, #3a1c4e);
	visibility: hidden; text-align: center; padding: 1rem;
}
#status::after { /* estrellas */
	content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .55;
	background-image: radial-gradient(1px 1px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 72% 12%, #fff, transparent),
		radial-gradient(1px 1px at 40% 30%, #cfe0ff, transparent), radial-gradient(1px 1px at 86% 40%, #fff, transparent),
		radial-gradient(1px 1px at 22% 46%, #fff, transparent), radial-gradient(1px 1px at 58% 8%, #ffe9b0, transparent);
}
.skyline { /* silueta de ciudad en CSS: no necesita imágenes */
	position: absolute; left: 0; right: 0; bottom: 0; height: 22vh; pointer-events: none; opacity: .9;
	background:
		linear-gradient(90deg, #1b1338 0 8%, #241a48 8% 14%, #1b1338 14% 23%, #2a1f52 23% 31%, #1b1338 31% 44%,
			#241a48 44% 52%, #1b1338 52% 63%, #2a1f52 63% 70%, #1b1338 70% 82%, #241a48 82% 90%, #1b1338 90%) bottom / 100% 70% no-repeat;
}
h1 {
	margin: 0; font-size: clamp(1.8rem, 6vw, 3.6rem); letter-spacing: .06em; line-height: 1.05;
	font-weight: 900; text-transform: uppercase; color: #fff4f6;
	text-shadow: 0 0 6px var(--neon), 0 0 22px rgba(255, 77, 116, .7), 3px 3px 0 #3a0d22;
}
h1 small { display: block; font-size: .42em; letter-spacing: .5em; color: var(--blue); text-shadow: 0 0 10px rgba(90, 160, 255, .8); }
.tagline { margin: 0; color: var(--gold); font-size: clamp(.85rem, 2.2vw, 1.05rem); }
.bar {
	width: min(420px, 78vw); height: 14px; border-radius: 8px; overflow: hidden; z-index: 1;
	border: 2px solid var(--blue); background: rgba(10, 8, 32, .85); box-shadow: 0 0 14px rgba(90, 160, 255, .45);
}
.bar > div {
	height: 100%; width: 0%; transition: width .15s linear;
	background: linear-gradient(90deg, var(--neon), #ffb35c); box-shadow: 0 0 12px var(--neon);
}
.bar.indeterminate > div { width: 35%; animation: slide 1.1s ease-in-out infinite alternate; }
@keyframes slide { from { margin-left: 0; } to { margin-left: 65%; } }
.skyline::before { /* ventanas encendidas */
	content: ""; position: absolute; left: 0; right: 0; top: 36%; bottom: 0;
	background:
		radial-gradient(circle, rgba(255, 210, 122, .38) 1px, transparent 1.6px) 0 0 / 19px 13px,
		radial-gradient(circle, rgba(168, 216, 255, .22) 1px, transparent 1.6px) 7px 5px / 29px 17px;
}
#status-label { font-size: .85rem; color: #b9b3e0; z-index: 1; min-height: 1.2em; }
#tip { max-width: 34rem; font-size: .9rem; color: #e8e1ff; opacity: .9; z-index: 1; min-height: 2.6em; transition: opacity .4s; }
#status-notice {
	display: none; max-width: 32rem; z-index: 1; padding: 1rem; border-radius: .5rem;
	background: #5b3943; border: 1px solid #9b3943; color: #f0e0e0; line-height: 1.35;
}

/* Aviso de orientación en teléfonos en vertical */
#rotate {
	position: fixed; inset: 0; z-index: 5; display: none;
	flex-direction: column; justify-content: center; align-items: center; gap: 1rem; padding: 2rem;
	background: rgba(10, 6, 24, .94); text-align: center;
}
#rotate .phone {
	width: 46px; height: 78px; border: 4px solid var(--gold); border-radius: 10px; position: relative;
	animation: turn 1.8s ease-in-out infinite;
}
#rotate .phone::after { content: ""; position: absolute; left: 50%; bottom: 4px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--gold); }
@keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
#rotate button {
	font: inherit; color: #fff; background: transparent; border: 2px solid var(--blue); border-radius: 8px; padding: .5rem 1rem;
}
@media (orientation: portrait) and (max-width: 820px) {
	body:not(.rotate-dismissed) #rotate { display: flex; }
}
	</style>
	$GODOT_HEAD_INCLUDE
</head>
<body>
	<canvas id="canvas">Tu navegador no soporta el elemento canvas.</canvas>
	<noscript>Este juego necesita JavaScript activado.</noscript>

	<div id="status">
		<div class="skyline"></div>
		<h1><small>Escape de</small>Bucaramanga</h1>
		<p class="tagline">Una noche, una confusión y toda la ciudad por delante</p>
		<div class="bar indeterminate" id="bar"><div id="bar-fill"></div></div>
		<div id="status-label">Cargando la ciudad…</div>
		<div id="tip"></div>
		<div id="status-notice"></div>
	</div>

	<div id="rotate" role="dialog" aria-label="Gira tu teléfono">
		<div class="phone"></div>
		<p>Gira tu teléfono para jugar en horizontal.</p>
		<button type="button" onclick="document.body.classList.add('rotate-dismissed')">Jugar así</button>
	</div>

	<script src="$GODOT_URL"></script>
	<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const bar = document.getElementById('bar');
	const barFill = document.getElementById('bar-fill');
	const label = document.getElementById('status-label');
	const notice = document.getElementById('status-notice');
	const tip = document.getElementById('tip');
	const tips = [
		'Mantén el botón de salto para llegar más alto.',
		'Hay 3 hormigas culonas escondidas en las rutas altas de cada nivel.',
		'Pisa varios drones sin tocar el suelo para multiplicar el combo.',
		'Corre (SHIFT) antes de los huecos largos del Viaducto de la Novena.',
		'Cada 25 granizados ganas una vida extra.',
		'Presiona M en cualquier momento para silenciar el juego.',
	];
	let tipIndex = Math.floor(Math.random() * tips.length);
	tip.textContent = tips[tipIndex];
	const tipTimer = setInterval(() => {
		tip.style.opacity = 0;
		setTimeout(() => { tipIndex = (tipIndex + 1) % tips.length; tip.textContent = tips[tipIndex]; tip.style.opacity = 1; }, 400);
	}, 3800);

	let initializing = true;
	statusOverlay.style.visibility = 'visible';

	function hideStatus() {
		clearInterval(tipTimer);
		statusOverlay.style.transition = 'opacity .5s';
		statusOverlay.style.opacity = 0;
		setTimeout(() => statusOverlay.remove(), 520);
		initializing = false;
	}

	function showFailure(err) {
		console.error(err);
		const msg = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'Ocurrió un error desconocido.');
		notice.textContent = '';
		msg.split('\n').forEach((line) => { notice.appendChild(document.createTextNode(line)); notice.appendChild(document.createElement('br')); });
		notice.style.display = 'block';
		bar.style.display = 'none';
		label.textContent = 'No se pudo iniciar el juego.';
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		showFailure('Tu navegador no tiene funciones necesarias para el juego (WebGL 2):\n' + missing.join('\n') +
			'\nPrueba con una versión reciente de Chrome, Edge, Firefox o Safari.');
		return;
	}
	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				bar.classList.remove('indeterminate');
				const pct = Math.min(100, Math.round((current / total) * 100));
				barFill.style.width = pct + '%';
				label.textContent = 'Cargando la ciudad… ' + pct + ' %';
			}
		},
	}).then(hideStatus, showFailure);
}());
	</script>
</body>
</html>
